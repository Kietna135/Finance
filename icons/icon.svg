<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Inner Soft Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Main Receipt / Finance Card (Centered) -->
  <g filter="url(#dropShadow)">
    <path d="M140 100 
             C140 85 152 72 168 72 
             L344 72 
             C360 72 372 85 372 100 
             L372 410 
             L344 394 
             L316 410 
             L288 394 
             L260 410 
             L232 394 
             L204 410 
             L176 394 
             L148 410 
             L140 404 Z" 
          fill="url(#receiptGrad)" />
  </g>

  <!-- Receipt Details & Graphics -->
  <!-- Top Badge Accent -->
  <rect x="180" y="112" width="152" height="14" rx="7" fill="#2563eb" />
  
  <!-- Line 1: Main Stat Bar -->
  <rect x="172" y="152" width="168" height="12" rx="6" fill="#64748b" fill-opacity="0.7" />
  
  <!-- Line 2: Stat Bar -->
  <rect x="172" y="180" width="120" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6" />
  
  <!-- Line 3: Stat Bar -->
  <rect x="172" y="204" width="144" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6" />

  <!-- Middle Divider (Dashed) -->
  <line x1="168" y1="236" x2="344" y2="236" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Mini Chart inside Receipt -->
  <rect x="172" y="290" width="24" height="45" rx="4" fill="#3b82f6" />
  <rect x="204" y="270" width="24" height="65" rx="4" fill="#10b981" />
  <rect x="236" y="250" width="24" height="85" rx="4" fill="#6366f1" />
  <rect x="268" y="280" width="24" height="55" rx="4" fill="#f59e0b" />
  <rect x="300" y="260" width="24" height="75" rx="4" fill="#ec4899" />

  <!-- Total Summary Row -->
  <rect x="168" y="348" width="80" height="12" rx="6" fill="#475569" />
  <rect x="272" y="344" width="72" height="18" rx="6" fill="#10b981" />
</svg>
