name: Build Release APK & Create Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-App
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Finance App v2.0.0 - Giao Diện Sáng & Đầy Đủ Tính Năng (APK)"
          body: |
            ## 💰 Finance App v2.0.0 (Bản Chính Thức)
            
            ### ✨ Các tính năng nổi bật:
            - ☀️ **Giao diện Sáng (Light Theme)** hiện đại, sắc nét Material 3.
            - 💳 **Quản lý Thu / Chi & Số Dư Khả Dụng** (Income, Expense & Balance).
            - 🧾 **Trình Quét OCR Hóa Đơn Tự Động** & Xem lại ảnh hóa đơn gốc đính kèm.
            - 📅 **Lịch Thu Chi Tương Tác** theo ngày trực quan.
            - 🎯 **Quản Lý Hạn Mức Ngân Sách** & Cảnh báo thông minh khi vượt hạn mức.
            - 📊 **Phân Tích Biểu Đồ Đa Chiều** (Biểu đồ tròn Donut & Biểu đồ cột xu hướng).
            - 💾 **Sao Lưu & Xuất / Khôi Phục Dữ Liệu** (CSV Excel & JSON).
            
            ---
            ### 📥 Tải xuống tệp cài đặt:
            Tải file **`Finance-App.apk`** bên dưới và cài đặt trên điện thoại Android của bạn.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            Finance-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
