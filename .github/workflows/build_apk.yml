name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Check & create Android scaffolding if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding android directory..."
            flutter create . --platforms=android --org=com.example.finance
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-release
          name: Finance Release v1.0.0 (APK)
          body: |
            ## 🚀 Tải Xuống File Cài Đặt Android (Release APK)
            - **Tên file**: `app-release.apk`
            - **Tính năng**: Quản lý chi tiêu, AI OCR trích xuất hóa đơn, Biểu đồ Canvas, Quản lý danh mục & Ngân sách.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
